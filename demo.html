<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Guider — Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    #guider-widget {
      width: 380px;
      height: 560px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #guider-header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      padding: 18px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #guider-header .avatar {
      width: 42px;
      height: 42px;
      background: #e8c96d;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    #guider-header .info h3 { font-size: 15px; }
    #guider-header .info p { font-size: 11px; opacity: 0.7; margin-top: 2px; }
    #guider-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
    }
    .msg.bot {
      background: #f0f0f0;
      align-self: flex-end;
      border-bottom-right-radius: 4px;
    }
    .msg.user {
      background: #1a1a2e;
      color: #fff;
      align-self: flex-start;
      border-bottom-left-radius: 4px;
    }
    .typing {
      display: flex;
      gap: 4px;
      padding: 10px 14px;
      background: #f0f0f0;
      border-radius: 16px;
      border-bottom-right-radius: 4px;
      align-self: flex-end;
      width: fit-content;
    }
    .typing span {
      width: 8px; height: 8px;
      background: #999;
      border-radius: 50%;
      animation: bounce 1s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }
    #guider-input-area {
      padding: 12px 16px;
      border-top: 1px solid #eee;
      display: flex;
      gap: 8px;
    }
    #guider-input {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 24px;
      padding: 10px 16px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      direction: rtl;
    }
    #guider-input:focus { border-color: #1a1a2e; }
    #guider-send {
      width: 42px; height: 42px;
      background: #1a1a2e;
      border: none;
      border-radius: 50%;
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #guider-send:hover { background: #e8c96d; color: #1a1a2e; }
  </style>
</head>
<body>

<div id="guider-widget">
  <div id="guider-header">
    <div class="avatar">🤖</div>
    <div class="info">
      <h3>Guider</h3>
      <p>مساعدك الذكي للتسوق</p>
    </div>
  </div>
  <div id="guider-messages"></div>
  <div id="guider-input-area">
    <button id="guider-send">➤</button>
    <input id="guider-input" type="text" placeholder="اكتب رسالتك..." />
  </div>
</div>

<script>
  const BACKEND_URL = 'https://guider-app.vercel.app/api/index';

  const products = [
    { name: 'قهوة إثيوبية', price: 85, currency: 'SAR', category: 'قهوة مختصة' },
    { name: 'قهوة كولومبية', price: 75, currency: 'SAR', category: 'قهوة مختصة' },
    { name: 'قهوة يمنية', price: 120, currency: 'SAR', category: 'قهوة نادرة' },
    { name: 'موكا يرغاشيف', price: 95, currency: 'SAR', category: 'قهوة مختصة' },
    { name: 'بلندر قهوة', price: 55, currency: 'SAR', category: 'خلطات' },
  ];

  const messages = [];
  const messagesEl = document.getElementById('guider-messages');
  const inputEl = document.getElementById('guider-input');

  function addMessage(text, role) {
    const div = document.createElement('div');
    div.className = `msg ${role === 'assistant' ? 'bot' : 'user'}`;
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing-indicator');
    if (t) t.remove();
  }

  async function sendMessage(text) {
    addMessage(text, 'user');
    messages.push({ role: 'user', content: text });
    showTyping();

    try {
      const res = await fetch(BACKEND_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ messages, products })
      });
      const data = await res.json();
      removeTyping();
      const reply = data.reply || 'عذراً، حدث خطأ.';
      addMessage(reply, 'assistant');
      messages.push({ role: 'assistant', content: reply });
    } catch (err) {
      removeTyping();
      addMessage('في مشكلة تقنية، حاول مجدداً.', 'assistant');
    }
  }

  document.getElementById('guider-send').addEventListener('click', () => {
    const text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = '';
    sendMessage(text);
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('guider-send').click();
  });

  window.onload = () => {
    const greeting = 'مرحباً! 👋 أنا Guider، مساعدك الذكي. أخبرني، إيش تبحث عنه اليوم؟';
    addMessage(greeting, 'assistant');
    messages.push({ role: 'assistant', content: greeting });
  };
</script>

</body>
</html>
